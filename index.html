<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061a10">
  <title>Kairaa Unisex Salon & Bridal | Velachery</title>
  <style>
    :root{
      --green:#061a10;
      --green2:#0b2819;
      --gold:#c99a3a;
      --gold-light:#f0d58a;
      --cream:#fffaf0;
      --muted:#d8d1c0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Georgia,"Times New Roman",serif;
      color:var(--cream);
      background:
        radial-gradient(circle at 50% 0%, #173d27 0%, transparent 42%),
        linear-gradient(145deg,var(--green),#020b06 75%);
      display:flex;
      justify-content:center;
    }
    .page{
      width:100%;
      max-width:480px;
      min-height:100vh;
      padding:28px 20px 34px;
      position:relative;
      overflow:hidden;
    }
    .gold-border{
      position:absolute;
      inset:12px;
      border:1px solid rgba(201,154,58,.45);
      pointer-events:none;
    }
    .brand{
      position:relative;
      margin:12px auto 24px;
      width:100%;
      border:1px solid rgba(201,154,58,.45);
      background:#031109;
      box-shadow:0 15px 45px rgba(0,0,0,.35);
    }
    .brand img{
      display:block;
      width:100%;
      height:auto;
    }
    .intro{
      text-align:center;
      margin:0 12px 24px;
    }
    .intro h1{
      font-size:25px;
      letter-spacing:2px;
      margin:0 0 7px;
      color:var(--gold-light);
      text-transform:uppercase;
    }
    .intro p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      letter-spacing:1px;
    }
    .links{
      display:grid;
      gap:13px;
      position:relative;
    }
    .link{
      min-height:64px;
      display:flex;
      align-items:center;
      gap:15px;
      padding:12px 17px;
      border:1px solid rgba(201,154,58,.58);
      border-radius:14px;
      color:var(--cream);
      text-decoration:none;
      background:linear-gradient(100deg,rgba(12,45,28,.95),rgba(5,22,13,.95));
      box-shadow:0 8px 22px rgba(0,0,0,.24);
      transition:transform .18s ease, border-color .18s ease;
    }
    .link:active{transform:scale(.98)}
    .icon{
      width:39px;height:39px;
      flex:0 0 39px;
      border-radius:50%;
      display:grid;
      place-items:center;
      border:1px solid var(--gold);
      color:var(--gold-light);
      font-size:20px;
      background:rgba(201,154,58,.08);
    }
    .copy strong{
      display:block;
      font-size:16px;
      letter-spacing:.4px;
      margin-bottom:3px;
    }
    .copy span{
      display:block;
      font-family:Arial,sans-serif;
      font-size:12px;
      color:#c9c2b2;
    }
    .placeholder{
      opacity:.62;
      border-style:dashed;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="gold-border"></div>

    <div class="brand">
      <img src="assets/kairaa-brand.jpg" alt="Kairaa Unisex Salon & Bridal - Velachery">
    </div>

    <section class="intro">
      <h1>Kairaa</h1>
      <p>Unisex Salon & Bridal · Velachery</p>
    </section>

    <section class="links" aria-label="Kairaa links">
      <a class="link" href="https://maps.app.goo.gl/FLjqvhhWrJdxmeBaA?g_st=ac" target="_blank" rel="noopener">
        <div class="icon">⌖</div>
        <div class="copy">
          <strong>Find Us on Google Maps</strong>
          <span>Get directions to Kairaa</span>
        </div>
      </a>

      <a class="link" href="https://g.page/r/CUmDZK1W_MZAEAE/review" target="_blank" rel="noopener">
        <div class="icon">★</div>
        <div class="copy">
          <strong>Write a Google Review</strong>
          <span>Share your experience with us</span>
        </div>
      </a>

      <a class="link" href="https://www.instagram.com/kairaa_unisexsalon_velachery?stkn=MW94aG5remRrdmVvdA==" target="_blank" rel="noopener">
        <div class="icon">◎</div>
        <div class="copy">
          <strong>Follow Us on Instagram</strong>
          <span>@kairaa_unisexsalon_velachery</span>
        </div>
      </a>

      <a class="link" href="https://wa.me/919150603864" target="_blank" rel="noopener">
        <div class="icon">◌</div>
        <div class="copy">
          <strong>WhatsApp Us</strong>
          <span>Chat with Kairaa</span>
        </div>
      </a>

      <a class="link" href="tel:+919150603864">
        <div class="icon">☎</div>
        <div class="copy">
          <strong>Call Us</strong>
          <span>+91 91506 03864</span>
        </div>
      </a>
    </section>

  </main>
</body>
</html>
